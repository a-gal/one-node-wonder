apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-gpu-operator
  namespace: nvidia-gpu-operator
spec:
  interval: 15m
  releaseName: nvidia-gpu-operator
  chart:
    spec:
      chart: gpu-operator
      version: 26.7.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    driver:
      enabled: false
    nfd:
      enabled: false
    migManager:
      enabled: false
    devicePlugin:
      config:
        map:
          default: |-
            version: v1
            sharing:
              timeSlicing:
                renameByDefault: false
                resources:
                  - name: nvidia.com/gpu
                    replicas: 5
